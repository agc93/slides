# Pages placed under these sections will be shown on homepage and archive page.
mainSections:
  - post
rssFullContent: true
pagination:
  pagerSize: 5
footer:
  since: 2025
  customText: All content CC BY-NC-ND 4.0 licensed unless otherwise specified
dateFormat:
  published: Jan 02, 2006
lastUpdated: Jan 02, 2006 15:04 MST
sidebar:
  avatar:
    enabled: false
  subtitle: "Slides and recordings for conference presentations, talks, and workshops."
colorScheme:
  toggle: true
default: auto
imageProcessing:
  cover:
    enabled: true
content:
    enabled: true
comments:
  enabled: false
